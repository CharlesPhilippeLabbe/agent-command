root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/opsview ./cmd/opsview"
  entrypoint = ["./tmp/opsview"]
  args_bin = ["--port", "8888", "--srcdir", "../.."]
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "vendor", ".git"]
  delay = 1000
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
